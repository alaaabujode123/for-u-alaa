<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For U Specially</title>
<style>
body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(to bottom right, #ffe6f0, #fff0f5);
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  position: relative;
}

.cat {
  position: absolute;
  font-size: 30px;
  opacity: 0.2;
  animation: float 10s infinite linear;
}

@keyframes float {
  0% {transform: translateY(0);}
  50% {transform: translateY(-50px);}
  100% {transform: translateY(0);}
}

#loader {
  position: absolute;
  top:0; left:0; width:100%; height:100%;
  background: rgba(0,0,0,0.7);
  color: white;
  font-size: 24px;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 10;
  flex-direction: column;
}

.btn {
  padding: 15px 30px;
  margin: 10px;
  font-size: 20px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.3s;
}

#interested {background-color: #ff99cc; color:white;}
#not-interested {background-color: #ccc; color:black; position: relative;}

#fun-msg {
  position: absolute;
  top:10%;
  font-size: 20px;
  color: red;
  display: none;
}

</style>
</head>
<body>

<div id="loader">just for u alaa 🤍</div>

<div class="cat" style="top:20%; left:10%;">🐱 hema</div>
<div class="cat" style="top:50%; left:80%;">🐱 shera</div>
<div class="cat" style="top:70%; left:30%;">🐱 za3tora</div>

<div id="fun-msg">هاها، حاولت تهرب بس لازم تضغط مهتم 😆</div>

<button class="btn" id="interested">مهتم 🙂</button>
<button class="btn" id="not-interested">غير مهتم 😪</button>

<script>
window.addEventListener('load', function() {
  setTimeout(function() {
    document.getElementById('loader').style.display = 'none';
  }, 4000);
});

const btnInterested = document.getElementById('interested');
const btnNotInterested = document.getElementById('not-interested');
const funMsg = document.getElementById('fun-msg');

btnInterested.onclick = function() {
  alert('شكراً على اهتمامك 😊');
}

btnNotInterested.addEventListener('mouseenter', function() {
  funMsg.style.display = 'block';
  const x = Math.random() * (window.innerWidth - btnNotInterested.offsetWidth);
  const y = Math.random() * (window.innerHeight - btnNotInterested.offsetHeight);
  btnNotInterested.style.position = 'absolute';
  btnNotInterested.style.left = x + 'px';
  btnNotInterested.style.top = y + 'px';
});

btnNotInterested.addEventListener('mouseleave', function() {
  funMsg.style.display = 'none';
});
</script>

</body>
</html>
